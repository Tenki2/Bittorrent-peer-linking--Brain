session:
  id: null
  data_root: brain_data

ingest:
  bind_host: 0.0.0.0
  port: 8000
  destination_url: http://100.95.169.10:8000/ingest

aws:
  ssh_user: ubuntu
  ssh_key_path: cloud/aws.pem
  bootstrap_marker: /home/ubuntu/bootstrap.finished
  ec2init_path: cloud/ec2init.sh

docker:
  image: ghcr.io/tenki2/btclient:dev
  runtime_seconds: 360
  listen_port: 51413
  torrent_source: /opt/torrents/bigAWS.torrent
  snapshot_interval_ms: 1000
  victim_start_delay_seconds: 60
  stop_adversaries_after_victim: true
  adversary_preseed_source: /opt/preseed/big-file.bin
  adversary_preseed_target: /app/data/big-file.bin

